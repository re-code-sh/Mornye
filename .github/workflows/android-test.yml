name: Android Test Build

# Quick Android-only test build. Unlike Release, this builds no other
# platform. The APKs get the package name com.zarz.mornye.test and the
# launcher label "Mornye Test", so they install next to the normal Mornye
# app instead of replacing it, with their own separate app data.
#
# The build is Lite (no Discord SDK). When the TEST_KEYSTORE_* repository
# secrets are set, the APKs are signed with that stable test keystore, so
# an update installs over the previous test build instead of requiring an
# uninstall. Without the secrets the build falls back to Gradle's debug
# key (a fresh key on every runner, so updates then need an uninstall).
# Switching to the stable keystore needs one last uninstall of the build
# signed with the old key.
#
# Run it by hand for a test build, or push a version tag to also publish
# the APKs on that tag's GitHub release, as a draft to review before it
# goes out. Tags follow the fork scheme v<upstream-version>.0.<n> (for
# example v5.4.0.0.1); the tag also becomes the APK's version
# (versionName 5.4.0.0.1, versionCode 5040001). Manual runs keep the
# version from pubspec.yaml.
#
#   git tag v5.4.0.0.1
#   git push origin v5.4.0.0.1

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-android-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MORNYE_DISCORD_SDK: "0"

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          df -h

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: rustup show

      - name: Install Rust binding generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-public-dependencies-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-public-dependencies-${{ runner.os }}-

      - name: Cache Android NDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/ndk/30.0.16248370
          key: ndk-30.0.16248370

      - name: Install Android SDK & NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;30.0.16248370" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;4.1.2"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      # Only this workflow's checkout is patched; the committed files keep
      # the real package name. The namespace stays com.zarz.mornye, and the
      # manifest providers already use ${applicationId}, so they follow
      # the new package name automatically.
      - name: Patch package name and label for the test build
        run: |
          set -euo pipefail
          sed -i 's/applicationId = "com.zarz.mornye"/applicationId = "com.zarz.mornye.test"/' \
            android/app/build.gradle.kts
          sed -i 's/android:label="Mornye"/android:label="Mornye Test"/' \
            android/app/src/main/AndroidManifest.xml

          grep -q 'applicationId = "com.zarz.mornye.test"' android/app/build.gradle.kts || {
            echo "ERROR: applicationId patch did not apply" >&2
            exit 1
          }
          grep -q 'android:label="Mornye Test"' android/app/src/main/AndroidManifest.xml || {
            echo "ERROR: app label patch did not apply" >&2
            exit 1
          }

      # Sign with the stable test keystore when its secrets are set, so
      # every test APK carries the same signature. Without the secrets
      # the build falls back to Gradle's debug key.
      - name: Set up test signing keystore
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.TEST_KEYSTORE_BASE64 }}
          TEST_KEYSTORE_PASSWORD: ${{ secrets.TEST_KEYSTORE_PASSWORD }}
          TEST_KEY_ALIAS: ${{ secrets.TEST_KEY_ALIAS }}
          TEST_KEY_PASSWORD: ${{ secrets.TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TEST_KEYSTORE_BASE64" ]; then
            echo "No test keystore secret set; the build will use Gradle's debug key." >&2
            exit 0
          fi
          printf '%s' "$TEST_KEYSTORE_BASE64" | base64 -d > android/mornye-test.keystore
          cat > android/key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/mornye-test.keystore
          storePassword=$TEST_KEYSTORE_PASSWORD
          keyAlias=$TEST_KEY_ALIAS
          keyPassword=$TEST_KEY_PASSWORD
          EOF
          echo "Test keystore configured."

      # On a tag push, take the version from the tag so the APK itself
      # carries the fork version (for example v5.4.0.0.1 -> versionName
      # 5.4.0.0.1, versionCode 5040001). Tags must match
      # v<major>.<minor>.<patch>.0.<n>; anything else fails here with a
      # clear error instead of halfway through the build. Manual runs
      # keep the version from pubspec.yaml.
      - name: Derive version from tag
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            echo "Manual run; keeping the version from pubspec.yaml."
            exit 0
          fi
          tag="${{ github.ref_name }}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)\.0\.([0-9]+)$ ]]; then
            echo "ERROR: tag '$tag' must match v<major>.<minor>.<patch>.0.<n> (for example v5.4.0.0.1)." >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          n="${BASH_REMATCH[4]}"
          if (( n >= 100 )); then
            echo "ERROR: fork counter in tag '$tag' must be below 100." >&2
            exit 1
          fi
          version_name="$major.$minor.$patch.0.$n"
          version_code=$((major * 1000000 + minor * 10000 + patch * 100 + n))
          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "Tag $tag -> versionName $version_name, versionCode $version_code"

      - name: Build test APKs (arm64 and arm32)
        run: |
          set -euo pipefail
          build_args=()
          if [ -n "${VERSION_NAME:-}" ]; then
            build_args+=(--build-name "$VERSION_NAME" --build-number "$VERSION_CODE")
          fi
          bash scripts/build_android.sh --lite --target lib/main.dart ${build_args[@]+"${build_args[@]}"}
          ls -la build/app/outputs/flutter-apk/

      - name: Verify and collect test APKs
        run: |
          set -euo pipefail
          apk_dir=build/app/outputs/flutter-apk
          aapt2="$ANDROID_HOME/build-tools/37.0.0/aapt2"

          mkdir -p test-apks
          cp "$apk_dir/app-arm64-v8a-release.apk" test-apks/Mornye-Test-arm64.apk
          cp "$apk_dir/app-armeabi-v7a-release.apk" test-apks/Mornye-Test-arm32.apk

          for apk in test-apks/Mornye-Test-arm64.apk test-apks/Mornye-Test-arm32.apk; do
            package="$("$aapt2" dump packagename "$apk")"
            if [ "$package" != "com.zarz.mornye.test" ]; then
              echo "ERROR: $apk has package $package, expected com.zarz.mornye.test" >&2
              exit 1
            fi
            "$aapt2" dump badging "$apk" | grep -E "^package:|^application-label:"
            if [ -n "${VERSION_NAME:-}" ]; then
              badging="$("$aapt2" dump badging "$apk")"
              echo "$badging" | grep -q "versionName='$VERSION_NAME'" || {
                echo "ERROR: $apk versionName is not $VERSION_NAME" >&2
                exit 1
              }
              echo "$badging" | grep -q "versionCode='$VERSION_CODE'" || {
                echo "ERROR: $apk versionCode is not $VERSION_CODE" >&2
                exit 1
              }
            fi
            echo "Signing certificate for $apk:"
            keytool -printcert -jarfile "$apk" 2>/dev/null | grep -i "SHA256" || true
          done

          (cd test-apks && sha256sum Mornye-Test-*.apk > SHA256SUMS.txt)

      - name: Upload test APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-apk
          if-no-files-found: error
          retention-days: 14
          path: |
            test-apks/Mornye-Test-*.apk
            test-apks/SHA256SUMS.txt

      # Only on a tag push: publish the APKs on the tag's GitHub release.
      # The release stays a draft until it is published from the Releases
      # page. To publish releases right away instead, drop --draft.
      - name: Create draft release and upload APKs
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Test build for ${{ github.ref_name }} (commit ${{ github.sha }}). Same Lite test APKs as the Android Test Build: package com.zarz.mornye.test, installs next to the normal Mornye app." \
            --draft \
            test-apks/Mornye-Test-arm64.apk \
            test-apks/Mornye-Test-arm32.apk \
            test-apks/SHA256SUMS.txt
